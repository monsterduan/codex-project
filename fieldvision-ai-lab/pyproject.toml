[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldvision-ai-lab"
version = "0.1.0"
description = "Evidence-first AI applications for vision experiments and edge diagnostics"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.27,<1", "langgraph==1.0.2"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]
semantic = ["sentence-transformers>=3.3,<6", "numpy>=1.26,<3"]
benchmark = ["onnxruntime>=1.20,<2", "numpy>=1.26,<3"]

[project.scripts]
fieldvision = "fieldvision.cli:main"

[tool.setuptools.packages.find]
include = ["fieldvision*"]

[tool.setuptools.package-data]
fieldvision = ["web/*.html", "sample_data/*.json", "sample_data/corpus/*.md", "sample_data/runs/*/*.csv", "sample_data/runs/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
